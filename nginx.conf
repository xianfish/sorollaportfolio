server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/markdown image/svg+xml;

    # Static assets with long cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /src/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CMS API proxy to decap-server
    location /api/ {
        proxy_pass http://cms:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else → static files
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
